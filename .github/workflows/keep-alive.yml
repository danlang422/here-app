name: Supabase Keep-Alive

# Pings the Here app's Supabase project twice a week so it doesn't
# get paused for inactivity (free tier pauses after 7 days with no
# database activity). Calls the public.ping() RPC function via the
# anon key — this generates a real database round-trip without
# needing the service role / secret key.

on:
  schedule:
    # Mon and Thu at 13:00 UTC (~8am Central, adjust if you want)
    - cron: "0 13 * * 1,4"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase responded with HTTP $response"
          # 200 means the ping() function ran — real database activity.
          # Fail on 000 (no connection) or anything unexpected.
          if [ "$response" = "000" ]; then
            echo "No response from Supabase — connection failed."
            exit 1
          elif [ "$response" != "200" ]; then
            echo "Unexpected response: $response"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
